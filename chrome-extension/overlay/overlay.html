<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eye Rest · weweweai</title>
<style>
*{ margin:0; padding:0; box-sizing:border-box; }
html, body {
  width: 100vw; height: 100vh;
  background: rgba(0,0,12,0.96);
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}

@keyframes radiate {
  0%   { transform: translate(-50%,-50%) scale(0.02); opacity: 0; }
  15%  { opacity: 1; }
  75%  { transform: translate(-50%,-50%) scale(1.05); }
  100% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
}
@keyframes breathe {
  0%,100% { transform: translate(-50%,-50%) scale(1); }
  50%     { transform: translate(-50%,-50%) scale(1.055); }
}
@keyframes ring {
  0%   { transform: translate(-50%,-50%) scale(0); opacity: 0.6; }
  100% { transform: translate(-50%,-50%) scale(1.9); opacity: 0; }
}
@keyframes fadein {
  from { opacity:0; transform:translateY(-10px); }
  to   { opacity:1; transform:translateY(0); }
}

#ring1,#ring2,#ring3 {
  position: fixed; left: 50%; top: 50%;
  border: 3px solid rgba(168,85,247,0.55);
  border-radius: 12px;
  pointer-events: none;
}
#wrap {
  position: fixed; left: 50%; top: 50%;
  opacity: 0;
  transform: translate(-50%,-50%) scale(0.02);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 0 80px rgba(168,85,247,0.6), 0 0 200px rgba(168,85,247,0.25);
  will-change: transform, opacity;
}
#wrap img {
  display: block; width: 100%; height: 100%;
  object-fit: cover; object-position: center;
  user-select: none; pointer-events: none;
}
#card {
  position: absolute; top:0; right:0;
  padding: 18px 20px 18px 28px;
  text-align: right;
  animation: fadein 0.5s ease 0.6s both;
}
#scrim {
  position: absolute; inset: 0;
  background: transparent;
  border-radius: 14px 14px 0 0;
  pointer-events: none;
}
.ci { position: relative; z-index: 1; }
#eye   { font-size:24px; margin-bottom:4px; }
#title { font-size:11px; font-weight:800; color:#fff; text-shadow:0 2px 12px rgba(0,0,0,1),0 0 28px rgba(0,0,0,.95); margin-bottom:2px; letter-spacing:.4px; }
#sub   { font-size:10px; color:rgba(255,255,255,.90); text-shadow:0 2px 10px rgba(0,0,0,1),0 0 22px rgba(0,0,0,.9); margin-bottom:10px; line-height:1.5; }
#timer { font-size:38px; font-weight:900; color:#c084fc; letter-spacing:3px; font-variant-numeric:tabular-nums; margin-bottom:12px;
         text-shadow:0 0 18px rgba(168,85,247,.9), 0 2px 8px rgba(0,0,0,.8); }
#btn {
  position: relative; z-index:1;
  background: rgba(168,85,247,0.22);
  border: 1.5px solid rgba(192,132,252,0.75);
  backdrop-filter: blur(6px);
  border-radius: 10px;
  padding: 8px 16px;
  color: #fff; font-size:11px; font-weight:700;
  cursor: pointer; opacity:.4;
  transition: all .3s;
  text-shadow: 0 2px 8px rgba(0,0,0,1);
  font-family: inherit;
}
#btn:hover { background: rgba(168,85,247,0.55); }
#btn.ready { opacity:1; }
</style>
</head>
<body>
<div id="ring1"></div>
<div id="ring2"></div>
<div id="ring3"></div>
<div id="wrap">
  <img id="avatar" alt="weweweai">
  <div id="card">
    <div id="scrim"></div>
    <div class="ci" id="eye">👀</div>
    <div class="ci" id="title"></div>
    <div class="ci" id="sub"></div>
    <div class="ci" id="timer">00 : 00</div>
    <button class="ci" id="btn"></button>
  </div>
</div>

<script src="overlay.js"></script>
</body>
</html>
